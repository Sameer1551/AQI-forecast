feature_groups:
  pollutant_core:
    columns: [pm25, pm10, no2, o3, co, so2]
    source: openaq
    refresh: hourly

  pollutant_temporal:
    columns: [pm25_lag1, pm25_lag6, pm25_roll24_mean, pm25_ewma, pm_ratio, no2_co_ratio]
    depends_on: [pollutant_core]
    source: derived
    refresh: hourly

  weather_core:
    columns: [temperature_2m, wind_speed_10m, wind_direction_10m, surface_pressure, boundary_layer_height]
    source: open_meteo
    refresh: hourly

  weather_derived:
    columns: [wind_dir_sin, wind_dir_cos, wind_u, wind_v, inversion_flag, bl_height_ratio, rain_last6h]
    depends_on: [weather_core]
    source: derived
    refresh: hourly

  urban_context:
    columns: [road_density_km_per_km2, industrial_landuse_pct, vegetation_pct, population_density, elevation_m]
    source: osm_ghsl_worldcover
    refresh: monthly_or_static

  event_context:
    columns: [fire_count_50km, fire_frp_50km, crop_burning_season_flag]
    source: firms_or_local_event_source
    refresh: daily

  graph_edge_features:
    columns: [distance_km, bearing_sin, bearing_cos, wind_alignment, travel_time_proxy, same_city_flag]
    depends_on: [weather_derived, urban_context]
    source: derived
    refresh: hourly

  calendar:
    columns: [hour_sin, hour_cos, dow_sin, dow_cos, month_sin, month_cos, is_weekend, is_rush_hour]
    source: derived
    refresh: static_function_of_timestamp
