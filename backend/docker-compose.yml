services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports: ["8501:8501"]
    depends_on: [api]
