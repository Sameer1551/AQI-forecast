"""
params.yaml — Single source of truth for DVC pipeline parameters.
Any parameter that can change the pipeline's outputs must be listed here.
DVC tracks this file for cache invalidation.
"""

features:
  lag_hours: [1, 3, 6, 12, 24, 48]
  rolling_windows: [3, 6, 12, 24]

model:
  name: st_graph_attention_transformer
  d_model: 64
  n_heads: 4
  n_temporal_layers: 2
  n_gat_layers: 2
  gat_heads: 4
  dropout: 0.1
  seq_len: 48
  n_features: 50
  n_pollutants: 6
  horizons: [1, 6, 24, 168]
  quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]

train:
  lr: 1.0e-3
  weight_decay: 1.0e-4
  epochs: 100
  patience: 10
  batch_size: 32
  grad_clip_norm: 1.0
  seed: 42

graph:
  type: dynamic_wind
  k_neighbors: 4
