[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=40 -v"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/models/core/train_ddp.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aqi-forecast"
version = "2.0.0"
description = "Real-Time Adaptive Spatio-Temporal AQI Prediction System"
requires-python = ">=3.11"
