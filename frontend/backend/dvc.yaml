stages:
  ingest:
    cmd: python -m src.ingestion.openaq_fetch && python -m src.ingestion.openmeteo_fetch
    outs:
      - data/raw
  validate:
    cmd: python -m src.validation.dataset_checks
    deps:
      - data/raw
    outs:
      - data/interim/_validation_report.json
  preprocess:
    cmd: python -m src.features.build_dataset
    deps:
      - data/raw
      - src/features/build_dataset.py
    outs:
      - data/interim
  featurize:
    cmd: python -m src.features.temporal_features
    deps:
      - data/interim
    outs:
      - data/feature_store
    params:
      - params.yaml:
          - features.lag_hours
          - features.rolling_windows
  train:
    cmd: python -m src.models.core.train
    deps:
      - data/feature_store
      - src/models/core/st_graph_attention_transformer.py
    params:
      - params.yaml:
          - train
          - model
    outs:
      - models/best_model.pt
    metrics:
      - metrics/train_metrics.json:
          cache: false
