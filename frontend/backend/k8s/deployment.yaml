apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqi-forecast-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: aqi-forecast-api}
  template:
    metadata:
      labels: {app: aqi-forecast-api}
    spec:
      containers:
        - name: api
          image: aqi-forecast:latest
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: aqi-forecast-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: aqi-forecast-api}
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
